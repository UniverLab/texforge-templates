id = "ieee"
version = "0.2.0"
display_name = "IEEE Journal"
description = "IEEE journal format — technical papers"

[files]
include = ["**/*.tex", "**/*.bib"]
exclude = []

[[placeholders]]
name = "title"
type = "string"
description = "Article title"
required = true

[[placeholders]]
name = "author"
type = "string"
description = "Main author"
required = true
default = "{{user.name}}"

[[placeholders]]
name = "email"
type = "string"
description = "Author e-mail"
required = false
default = "{{user.email}}"

[[placeholders]]
name = "affiliation"
type = "string"
description = "Author affiliation"
required = false
default = "Department, University, City, Country"

[[placeholders]]
name = "venue"
type = "string"
description = "Publication venue shown in the running head"
required = false
default = "Technical Report"

[[placeholders]]
name = "keywords"
type = "string"
description = "Index terms for the abstract"
required = false
default = "keyword one, keyword two, keyword three"

[[placeholders]]
name = "language"
type = "enum"
description = "Document language (for babel/polyglossia)"
required = true
choices = ["english", "spanish", "french", "german", "italian", "portuguese"]
default = "english"

[[post_generate]]
name = "install-packages"
description = "Install LaTeX packages if needed"
command = "texforge build"
optional = true

