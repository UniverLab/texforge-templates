id = "apa7-student"
version = "0.1.0"
display_name = "APA 7 Student Paper"
description = "APA 7 student paper (article class): student title page, APA heading levels, APA tables and references close to APA 7th edition. References use apacite, the closest BibTeX style that builds under tectonic: biblatex-apa needs the external biber binary, which is unavailable, and tectonic ships no APA 7 .bst. Known gaps vs APA 7 (et al. lists two names, BibTeX warnings) are documented in main.tex"

[files]
include = ["**/*.tex", "**/*.bib"]
exclude = []

[[placeholders]]
name = "title"
type = "string"
description = "Paper title"
required = true

[[placeholders]]
name = "author"
type = "string"
description = "Student name"
required = true
default = "{{user.name}}"

[[placeholders]]
name = "department"
type = "string"
description = "Department name"
required = false
default = "Sample Department"

[[placeholders]]
name = "institution"
type = "string"
description = "University or institution"
required = false
default = "{{institution.name}}"

[[placeholders]]
name = "course"
type = "string"
description = "Course code and name"
required = false
default = "Sample Course 101"

[[placeholders]]
name = "instructor"
type = "string"
description = "Instructor name"
required = false
default = "Sample Instructor"

[[placeholders]]
name = "date"
type = "string"
description = "Due date"
required = false
default = "\\today"

[[placeholders]]
name = "language"
type = "enum"
description = "Document language (for babel/polyglossia)"
required = true
choices = ["english", "spanish", "french", "german", "italian", "portuguese"]
default = "english"

[[post_generate]]
name = "install-packages"
description = "Install LaTeX packages if needed"
command = "texforge build"
optional = true
