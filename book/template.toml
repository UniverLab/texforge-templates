id = "book"
version = "0.2.0"
display_name = "Book"
description = "A long-form book layout with epigraphs, front matter, chapter openings and a literary paragraph style"

[files]
include = ["**/*.tex", "**/*.txt"]
exclude = []

[[placeholders]]
name = "title"
type = "string"
description = "Book title"
required = true

[[placeholders]]
name = "subtitle"
type = "string"
description = "Book subtitle"
required = false
default = "A Quiet Journey"

[[placeholders]]
name = "author"
type = "string"
description = "Book author"
required = true
default = "{{user.name}}"

[[placeholders]]
name = "publisher"
type = "string"
description = "Publisher or imprint"
required = false
default = "Independent Edition"

[[placeholders]]
name = "year"
type = "string"
description = "Publication year"
required = false
default = "2026"

[[placeholders]]
name = "language"
type = "enum"
description = "Document language for babel"
required = true
choices = ["english", "spanish", "french", "german", "italian", "portuguese"]
default = "english"

[[post_generate]]
name = "build"
description = "Compile the book to PDF"
command = "texforge build"
optional = true
