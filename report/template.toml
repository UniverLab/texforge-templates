id = "report"
version = "0.2.0"
display_name = "University Report"
description = "University report — structured academic report"

[files]
include = ["**/*.tex", "**/*.bib", "**/*.txt"]
exclude = []

[[placeholders]]
name = "title"
type = "string"
description = "Report title"
required = true

[[placeholders]]
name = "subtitle"
type = "string"
description = "Subtitle or short description"
required = false
default = "A Structured Academic Report"

[[placeholders]]
name = "author"
type = "string"
description = "Main author"
required = true
default = "{{user.name}}"

[[placeholders]]
name = "advisor"
type = "string"
description = "Advisor name"
required = false
default = "Advisor Name"

[[placeholders]]
name = "institution"
type = "string"
description = "Institution name"
required = false
default = "{{institution.name}}"

[[placeholders]]
name = "faculty"
type = "string"
description = "Faculty or department"
required = false
default = "Faculty of Engineering"

[[placeholders]]
name = "date"
type = "string"
description = "Submission date"
required = false
default = "\\today"

[[placeholders]]
name = "language"
type = "enum"
description = "Document language (for babel)"
required = true
choices = ["english", "spanish", "french", "german", "italian", "portuguese"]
default = "english"

[[post_generate]]
name = "build"
description = "Compile the report to PDF"
command = "texforge build"
optional = true
