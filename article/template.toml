id = "article"
version = "0.2.0"
display_name = "Article"
description = "Simple article — clean, portable academic article"

[files]
include = ["**/*.tex", "**/*.bib", "**/*.txt"]
exclude = []

[[placeholders]]
name = "title"
type = "string"
description = "Article title"
required = true

[[placeholders]]
name = "author"
type = "string"
description = "Main author"
required = true
default = "{{user.name}}"

[[placeholders]]
name = "affiliation"
type = "string"
description = "Author affiliation"
required = false
default = "Department, University, City, Country"

[[placeholders]]
name = "email"
type = "string"
description = "Author e-mail"
required = false
default = "{{user.email}}"

[[placeholders]]
name = "language"
type = "enum"
description = "Document language (for babel/polyglossia)"
required = true
choices = ["english", "spanish", "french", "german", "italian", "portuguese"]
default = "english"

[[post_generate]]
name = "install-packages"
description = "Install LaTeX packages if needed"
command = "texforge build"
optional = true
